<!--
  D-CRYPT Favicon — Browser Tab Icon
  ─────────────────────────────────────────────────────────
  This is a temporary text-based logo until a final brand
  logo is decided. To replace it:
    1. Export your logo as an SVG
    2. Replace this file (public/favicon.svg) with it
    3. Also replace public/icon-192.png and icon-512.png
       with PNG exports of the same logo
  ─────────────────────────────────────────────────────────
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#030711"/>

  <!-- Accent border top -->
  <rect x="0" y="0" width="64" height="2" rx="1" fill="url(#grad)"/>

  <!-- D-CRYPT text -->
  <text
    x="32"
    y="38"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Inter', 'Segoe UI', Arial, sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.5"
    fill="url(#grad)"
  >D-CRYPT</text>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
</svg>